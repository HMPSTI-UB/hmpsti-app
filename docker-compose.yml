services:
  postgres:
    image: postgres:16-alpine
    container_name: hmpsti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmpsti
      POSTGRES_PASSWORD: hmpsti_dev
      POSTGRES_DB: hmpsti
    ports:
      - "5432:5432"
    volumes:
      - hmpsti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmpsti -d hmpsti"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hmpsti_pgdata: